name: core
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with: { components: "rustfmt, clippy" }
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p auction_core --all-targets -- -D warnings
      - run: cargo test --locked -p auction_core
      - run: PROPTEST_CASES=2000 cargo test --locked -p auction_core --test invariants --test s5_pause_onset
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cargo run --locked -q -p auction_core --example vectors > /tmp/vectors.json && python3 tools/differential/check.py /tmp/vectors.json
