[workspace]
members = [
    "crates/auction_core",
    "crates/auction_sdk",
    "programs/auction_engine/core",
    "programs/auction_engine",
    "programs/auction_engine/methods",
    "programs/test_programs/core",
    "programs/test_programs/methods",
    "programs/token/core",
    "programs/token",
    "programs/token/methods",
    "programs/twap_oracle/core",
    "programs/stablecoin/core",
    "programs/stablecoin",
    "programs/stablecoin/methods",
    "programs/stablecoin/methods_b",
    "programs/upstream_integration_tests",
    "programs/integration_tests",
    "tools/idl-gen",
]
exclude = [
    "spikes",
    "programs/token/methods/guest",
    "programs/stablecoin/methods/guest",
    "programs/auction_engine/methods/guest",
    "programs/test_programs/methods/guest",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = ["host"] }
lee = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", features = ["test-utils"] }
auction_core = { path = "crates/auction_core" }
auction_sdk = { path = "crates/auction_sdk" }
auction_engine_core = { path = "programs/auction_engine/core" }
auction_engine_program = { path = "programs/auction_engine" }
token_core = { path = "programs/token/core" }
token_program = { path = "programs/token" }
twap_oracle_core = { path = "programs/twap_oracle/core" }
stablecoin_core = { path = "programs/stablecoin/core" }
stablecoin_program = { path = "programs/stablecoin" }
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.5", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5" }
serde_json = "1.0"

# Copied verbatim from lez-programs 64c01210 Cargo.toml: the vendored crates opt in with `[lints] workspace = true`.
[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious  = { level = "deny", priority = -1 }
perf        = { level = "deny", priority = -1 }
style       = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
allow_attributes = "warn"
allow_attributes_without_reason = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
as_conversions = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
large_enum_variant = "deny"
wildcard_enum_match_arm = "deny"
module_name_repetitions = "allow"
similar_names = "allow"

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true
