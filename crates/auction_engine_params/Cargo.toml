[package]
name = "auction_engine_params"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# LEZ-free: shared by the v0.2.4 engine core and the v0.4 workspace. Must not depend on lee / lee_core.
[dependencies]
auction_core = { path = "../auction_core" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
# Wire encoding of the flat argument structs; only the v0.4 engine messages enable it.
borsh = { version = "1.5", features = ["derive"], optional = true }

[features]
default = []
borsh = ["dep:borsh"]

[dev-dependencies]
serde_json = "1.0"
# Root workspace only: pins `seeds` to the v0.2.4 core's `pda` helpers (tests/seeds_match_core.rs).
# A dev-dependency is never resolved when the v0.4 workspace uses this crate as a path dependency.
auction_engine_core = { path = "../../programs/auction_engine/core" }
