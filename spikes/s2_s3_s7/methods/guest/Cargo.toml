[package]
name = "spike-guest"
version = "0.1.0"
edition = "2021"

[workspace]

[profile.release]
debug = 0
strip = "symbols"

[[bin]]
name = "callee"
path = "src/bin/callee.rs"

[[bin]]
name = "caller"
path = "src/bin/caller.rs"

[[bin]]
name = "impostor"
path = "src/bin/impostor.rs"

[dependencies]
spel-framework = { git = "https://github.com/logos-co/spel.git", rev = "1ef0500f8fc8ce3ddf95523726ae159db83f744f", package = "spel-framework" }
nssa_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.2.4", package = "lee_core" }
risc0-zkvm = { version = "=3.0.5", default-features = false }
# Same ruint pin as the lez-programs guests (guest toolchain MSRV).
ruint = { version = "=1.17.0", default-features = false }
spike_core = { path = "../../core" }
token_core = { git = "https://github.com/logos-blockchain/lez-programs", rev = "64c01210adecd6b557dbd021a3cc94553f243fd8", package = "token_core" }
serde = { version = "1.0", features = ["derive"] }
borsh = "1.5"
