[package]
name = "v04-guests"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Built by risc0_build from ../build.rs, outside the v04 workspace.
[workspace]

[dependencies]
lee_core = { git = "https://github.com/logos-blockchain/logos-execution-zone.git", tag = "v0.4.0-rc1" }
borsh = { version = "1.5.7", features = ["derive"] }
risc0-zkvm = { version = "=3.0.5", default-features = false, features = ["std"] }

[patch.crates-io]
keccak = { git = "https://github.com/logos-blockchain/sponges", rev = "3a56e99771beedf04946eab21a4a62adc2951377" }

[profile.release]
debug = 0
strip = "symbols"
