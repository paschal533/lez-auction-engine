[package]
name = "sdk"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
lee.workspace = true
lee_core.workspace = true
borsh.workspace = true
engine_core.workspace = true
# `holding_actor` (ADR-062): plans declare per-definition token holdings.
token_core.workspace = true
auction_engine_params.workspace = true
# `RiskArgs` and its presets (ADR-082); the presets are host-only.
risk_core = { workspace = true, features = ["borsh", "presets"] }
# The reference oracle's state, which the system plans price at (`engine_core::system::ref_price`).
oracle_core.workspace = true
# The live-sequencer half (`live`): RPC client, transaction wire type, wallet keys and program loader.
common.workspace = true
sequencer_service_rpc.workspace = true
wallet.workspace = true
tokio = { workspace = true, features = ["time"] }
# The examples' live session (`session`, behind the `session` feature): the mock host's messages, the clock and derived keys.
mock_host_core = { workspace = true, optional = true }
clock_core = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
harness.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
default = []
# The e2e examples' live session (`sdk::session`); pulls in the mock host.
session = ["dep:mock_host_core", "dep:clock_core", "dep:sha2"]

[[example]]
name = "slice"
required-features = ["session"]

[[example]]
name = "system"
required-features = ["session"]
